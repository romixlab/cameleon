[package]
name = "stream_egui"
version = "0.1.0"
edition = "2024"

[dependencies]
cameleon = { path = "../../cameleon" }
cameleon-device = { path = "../../device" }
egui = { version = "0.33", features = ["persistence"] }
eframe = { version = "0.33", features = ["persistence"] }
egui_extras = { version = "0.33", features = ["image"] }
image = "0.25.5"
#imageproc = "0.25.0"
tokio = { version = "1.40.0", features = ["full"] }
tracing-subscriber = { version = "0.3.18", features = ["default", "env-filter"] }
bayer = { git = "https://github.com/virtualritz/libbayer", version = "0.2.0" }
get_if_addrs = "0.5.3"
serde = { version = "1.0.228", features = ["derive"] }